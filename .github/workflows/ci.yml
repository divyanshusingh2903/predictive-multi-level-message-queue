name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  online-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ml_engine/requirements-models.txt
      - name: Install pinned model environment
        run: python -m pip install -r ml_engine/requirements-models.txt && python -m pip check
      - name: Contract and delayed replay tests
        run: python -m unittest discover -s ml_engine/tests -v
      - name: Required River estimator tests
        run: python -m unittest discover -s ml_engine/model_tests -v

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev python3
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DHARBINGER_WARNINGS_AS_ERRORS=ON -DHARBINGER_REQUIRE_PYTHON_TESTS=ON -DHARBINGER_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    strategy:
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHARBINGER_SANITIZER=${{ matrix.sanitizer }} -DHARBINGER_WARNINGS_AS_ERRORS=ON -DHARBINGER_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHARBINGER_SANITIZER=thread -DHARBINGER_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-ci --parallel
      # 24.04 runners use 32-bit mmap ASLR, which GCC's TSan rejects as an unexpected mapping.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      # Transport TSan tests require instrumented gRPC/Protobuf, not distro binaries.
      - name: Test queue concurrency
        run: ./build-ci/tests/harbinger_unit_tests --gtest_filter='MultiLevelQueue.*'
